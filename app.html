<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <title>NERO</title>
  <link rel="stylesheet" href="/css/app.css">
  <script src="/config.js" defer></script>
  <script src="/js/pages.js" defer></script>
  <script src="/js/app.js" defer></script>
  <script>
  window.addEventListener('DOMContentLoaded', function () {
    const root = document.documentElement;
    const settings = document.querySelector('#settings .set');
    if (!settings || document.getElementById('nero-customization')) return;

    const style = document.createElement('style');
    style.id = 'nero-customization-styles';
    style.textContent = [
      'body{background:var(--nero-wall-color,var(--bg))}',
      '#wp{background-color:var(--nero-wall-color,var(--bg));filter:blur(var(--wb,8px)) brightness(var(--wall-brightness,.5))}',
      '#settings .custom-colors[hidden]{display:none}',
      '#settings .customization-note{margin:7px 0 0;color:var(--mute);font-size:11px;line-height:1.5}',
      '#settings .custom-color-row{display:flex;align-items:center;gap:10px;flex:1;justify-content:flex-end}',
      '#settings .custom-color-row input[type=color]{width:42px;height:38px}',
      'body[data-compact="on"] .tab{padding:4px 6px 4px 9px;font-size:12px}',
      'body[data-compact="on"] .shortcut{min-height:88px;padding:9px 6px}',
      'body[data-compact="on"] .top{padding-top:5px;padding-bottom:5px}',
      'body[data-compact="on"] .opt{min-height:70px;padding:10px}',
      'body[data-sidebar-style="minimal"] .wrap>nav{width:46px;border-right:0;background:transparent}',
      'body[data-sidebar-style="minimal"] .wrap>nav button{border-radius:8px}',
      'body[data-sidebar-style="floating"] .wrap>nav{width:58px;margin:9px 0 9px 9px;border:1px solid var(--line);border-radius:16px;background:color-mix(in srgb,var(--panel) var(--ui-panel-alpha,100%),transparent);overflow:hidden}',
      'body[data-sidebar-style="floating"] .wrap>nav button{border-radius:10px}',
      'body[data-sidebar-style="floating"] .wrap>nav .sp{flex:1}',
      '.tab,.url,.search,.shortcut,.opt,.memory-panel,.memory-tools,.sf,.chat-sidebar,.msg,.cbar,#settings select,#settings input:not([type=checkbox]):not([type=range]):not([type=color]){border-radius:var(--ui-radius,12px)!important}',
      '.top,.wrap>nav,#vtabs,.tab.on,.shortcut,.opt,.memory-panel,.memory-tools,.chat-sidebar,.cbar{background-color:color-mix(in srgb,var(--panel) var(--ui-panel-alpha,100%),transparent)}'
    ].join('\n');
    document.head.appendChild(style);

    const section = document.createElement('div');
    section.id = 'nero-customization';
    section.innerHTML =
      '<h2>themes</h2>' +
      '<div class="grp"><div class="gl">Choose a theme</div>' +
      '<select id="nero-theme" aria-label="NERO theme">' +
      '<option value="nero">NERO Dark</option><option value="midnight">Midnight</option>' +
      '<option value="amoled">AMOLED Black</option><option value="light">Light</option>' +
      '<option value="forest">Forest</option><option value="custom">Custom</option></select>' +
      '<p class="customization-note">Themes change the browser interface colors. Your accent color setting can still override the theme accent.</p></div>' +
      '<div class="custom-colors" id="nero-custom-colors" hidden>' +
      '<div class="row"><div>background color</div><div class="custom-color-row"><input type="color" id="nero-theme-bg" value="#050505"></div></div>' +
      '<div class="row"><div>panel color</div><div class="custom-color-row"><input type="color" id="nero-theme-panel" value="#0e0e0e"></div></div>' +
      '<div class="row"><div>text color</div><div class="custom-color-row"><input type="color" id="nero-theme-text" value="#f2f2f2"></div></div>' +
      '</div>' +
      '<h2>interface</h2>' +
      '<div class="row"><div>compact mode<small>Reduce spacing and make controls smaller</small></div><input type="checkbox" id="nero-compact" aria-label="Compact mode"></div>' +
      '<div class="row"><div>corner roundness<small>Adjust the shape of tabs, cards and controls</small></div><input type="range" id="nero-radius" min="0" max="24" value="12" aria-label="Corner roundness"></div>' +
      '<div class="row"><div>sidebar style<small>Choose how the navigation rail looks</small></div><select id="nero-sidebar"><option value="standard">Standard</option><option value="minimal">Minimal</option><option value="floating">Floating</option></select></div>' +
      '<div class="row"><div>panel transparency<small>Make panels more transparent to show the background</small></div><input type="range" id="nero-transparency" min="0" max="45" value="0" aria-label="Panel transparency"></div>' +
      '<h2>backgrounds</h2>' +
      '<div class="row"><div>solid background<small>Choose the color behind your wallpaper</small></div><div class="custom-color-row"><input type="color" id="nero-wall-color" value="#050505"><button class="ghost" id="nero-wall-reset" type="button">Reset</button></div></div>' +
      '<div class="row"><div>wallpaper URL<small>Use an image hosted online (https://)</small></div><div class="ctl"><input id="nero-wall-url" type="url" placeholder="https://example.com/wallpaper.jpg" aria-label="Wallpaper URL"><button class="ghost" id="nero-wall-apply" type="button">Apply</button></div></div>' +
      '<div class="row"><div>wallpaper brightness<small>Adjust how bright the wallpaper appears</small></div><input type="range" id="nero-wall-brightness" min="20" max="100" value="50" aria-label="Wallpaper brightness"></div>' +
      '<p class="customization-note">Your existing wallpaper upload and blur controls are still available above. All customization choices save in this browser.</p>';

    const proxyHeading = settings.querySelector('h2');
    settings.insertBefore(section, proxyHeading || null);

    const themes = {
      nero: {bg:'#050505',panel:'#0e0e0e',line:'#1f1f1f',text:'#f2f2f2',mute:'#7d7d7d',acc:'#e8e8e8',scheme:'dark'},
      midnight: {bg:'#080d1a',panel:'#101a2b',line:'#26354c',text:'#eaf0ff',mute:'#8b9bb5',acc:'#8ab4ff',scheme:'dark'},
      amoled: {bg:'#000000',panel:'#080808',line:'#1c1c1c',text:'#f5f5f5',mute:'#858585',acc:'#ffffff',scheme:'dark'},
      light: {bg:'#f5f6f8',panel:'#ffffff',line:'#e1e4e8',text:'#20242a',mute:'#707780',acc:'#2563eb',scheme:'light'},
      forest: {bg:'#07130f',panel:'#0f211a',line:'#244235',text:'#e4f5eb',mute:'#93b3a2',acc:'#4ade80',scheme:'dark'}
    };
    const themeSelect = document.getElementById('nero-theme');
    const customColors = document.getElementById('nero-custom-colors');
    const colorInputs = {
      bg: document.getElementById('nero-theme-bg'),
      panel: document.getElementById('nero-theme-panel'),
      text: document.getElementById('nero-theme-text')
    };
    function persistTheme(name, values) {
      try { localStorage.setItem('nero.custom.theme', name); if (values) localStorage.setItem('nero.custom.theme.colors', JSON.stringify(values)); } catch (e) {}
    }
    function applyTheme(name, values, persist) {
      const theme = themes[name];
      customColors.hidden = name !== 'custom';
      if (theme) values = theme;
      if (!values) {
        try { values = JSON.parse(localStorage.getItem('nero.custom.theme.colors') || 'null'); } catch (e) {}
      }
      if (name === 'custom' && !values) values = {bg:'#050505',panel:'#0e0e0e',text:'#f2f2f2',line:'#1f1f1f',mute:'#7d7d7d',acc:'#e8e8e8',scheme:'dark'};
      if (values) {
        root.style.setProperty('--bg', values.bg);
        root.style.setProperty('--panel', values.panel);
        root.style.setProperty('--line', values.line || '#1f1f1f');
        root.style.setProperty('--text', values.text);
        root.style.setProperty('--mute', values.mute || '#7d7d7d');
        root.style.colorScheme = values.scheme || 'dark';
        if (!localStorage.getItem('fl-acc')) root.style.setProperty('--acc', values.acc || '#e8e8e8');
        colorInputs.bg.value = values.bg;
        colorInputs.panel.value = values.panel;
        colorInputs.text.value = values.text;
      }
      themeSelect.value = name;
      if (persist) persistTheme(name, name === 'custom' ? values : null);
    }
    themeSelect.addEventListener('change', function () {
      const name = themeSelect.value;
      if (name === 'custom') {
        let values;
        try { values = JSON.parse(localStorage.getItem('nero.custom.theme.colors') || 'null'); } catch (e) {}
        applyTheme(name, values, true);
      } else applyTheme(name, null, true);
    });
    function updateCustomTheme() {
      const values = {
        bg: colorInputs.bg.value, panel: colorInputs.panel.value, text: colorInputs.text.value,
        line: colorInputs.panel.value, mute: colorInputs.text.value, acc: '#e8e8e8', scheme: 'dark'
      };
      applyTheme('custom', values, true);
    }
    Object.values(colorInputs).forEach(input => input.addEventListener('input', updateCustomTheme));
    let savedTheme = 'nero';
    try { savedTheme = localStorage.getItem('nero.custom.theme') || 'nero'; } catch (e) {}
    applyTheme(themes[savedTheme] ? savedTheme : 'custom', null, false);

    function storeSetting(key, value) { try { localStorage.setItem(key, String(value)); } catch (e) {} }
    const compact = document.getElementById('nero-compact');
    const radius = document.getElementById('nero-radius');
    const sidebar = document.getElementById('nero-sidebar');
    const transparency = document.getElementById('nero-transparency');
    function applyCompact(value) { document.body.dataset.compact = value ? 'on' : 'off'; compact.checked = value; storeSetting('nero.ui.compact', value ? '1' : '0'); }
    function applyRadius(value) { root.style.setProperty('--ui-radius', value + 'px'); radius.value = value; storeSetting('nero.ui.radius', value); }
    function applySidebar(value) { document.body.dataset.sidebarStyle = value; sidebar.value = value; storeSetting('nero.ui.sidebar', value); }
    function applyTransparency(value) { root.style.setProperty('--ui-panel-alpha', (100 - value) + '%'); transparency.value = value; storeSetting('nero.ui.transparency', value); }
    applyCompact(localStorage.getItem('nero.ui.compact') === '1');
    applyRadius(Math.max(0, Math.min(24, Number(localStorage.getItem('nero.ui.radius') || 12))));
    applySidebar(['standard','minimal','floating'].includes(localStorage.getItem('nero.ui.sidebar')) ? localStorage.getItem('nero.ui.sidebar') : 'standard');
    applyTransparency(Math.max(0, Math.min(45, Number(localStorage.getItem('nero.ui.transparency') || 0))));
    compact.addEventListener('change', function () { applyCompact(compact.checked); });
    radius.addEventListener('input', function () { applyRadius(Number(radius.value)); });
    sidebar.addEventListener('change', function () { applySidebar(sidebar.value); });
    transparency.addEventListener('input', function () { applyTransparency(Number(transparency.value)); });

    const wallColor = document.getElementById('nero-wall-color');
    const wallUrl = document.getElementById('nero-wall-url');
    const wallBrightness = document.getElementById('nero-wall-brightness');
    function applyWallColor(value) {
      root.style.setProperty('--nero-wall-color', value);
      wallColor.value = value;
      storeSetting('nero.wall.color', value);
    }
    const savedWallColor = localStorage.getItem('nero.wall.color') || '#050505';
    applyWallColor(savedWallColor);
    wallColor.addEventListener('input', function () { applyWallColor(wallColor.value); });
    document.getElementById('nero-wall-reset').addEventListener('click', function () { applyWallColor('#050505'); });
    const savedWall = localStorage.getItem('fl-wp') || '';
    if (/^https?:\/\//i.test(savedWall)) wallUrl.value = savedWall;
    document.getElementById('nero-wall-apply').addEventListener('click', function () {
      const value = wallUrl.value.trim();
      if (!value) { toast('Enter a wallpaper URL first'); return; }
      try {
        const url = new URL(value);
        if (!['http:','https:'].includes(url.protocol)) throw new Error();
        setWp(url.href);
        wallUrl.value = url.href;
        toast('Wallpaper applied');
      } catch (e) { toast('Enter a valid http(s) image URL'); }
    });
    function applyBrightness(value) {
      root.style.setProperty('--wall-brightness', (value / 100).toFixed(2));
      wallBrightness.value = value;
      storeSetting('nero.wall.brightness', value);
    }
    applyBrightness(Math.max(20, Math.min(100, Number(localStorage.getItem('nero.wall.brightness') || 50))));
    wallBrightness.addEventListener('input', function () { applyBrightness(Number(wallBrightness.value)); });
  });
  </script>

  <script>
  window.addEventListener('DOMContentLoaded', function () {
    const root=document.documentElement, settings=document.querySelector('#settings .set');
    if(!settings || document.getElementById('nero-qol-tools')) return;
    const css=document.createElement('style');
    css.textContent=`
      #settings .set{display:flex;flex-direction:column;gap:0;width:min(100%,820px);max-width:820px}
      #settings #nero-customization{display:contents}
      #settings .set>h2,#settings .set>#nero-customization h2{margin:26px 0 12px;padding:0 0 10px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.09em;color:var(--mute)}
      #settings .set>.grp,#settings .set>.row,#settings #nero-customization>.grp,#settings #nero-customization>.row,#settings #nero-customization>.custom-colors{width:100%;max-width:100%;min-width:0}
      #settings .set .row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:64px;padding:12px 14px;margin:0;border-bottom:1px solid color-mix(in srgb,var(--line) 65%,transparent);border-radius:10px}
      #settings .set .row>div:first-child{flex:1;min-width:0}
      #settings .set .row>.ctl,#settings .set .row>.custom-color-row{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex:0 1 360px;min-width:0}
      #settings .set .row input[type=range]{width:min(220px,35%);flex:none}
      #settings .set .row select{width:min(240px,45%);flex:none}
      #settings #nero-customization .grp{margin:0 0 12px;padding:14px;border:1px solid var(--line);border-radius:13px;background:color-mix(in srgb,var(--panel) 82%,transparent)}
      #settings #nero-customization .grp .gl{font-weight:600}
      #settings #nero-customization .custom-colors{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px;margin:10px 0 18px}
      #settings #nero-customization .custom-colors .row{border:1px solid var(--line);background:var(--panel)}
      #settings .nero-tools{display:flex;flex-wrap:wrap;gap:9px;margin:10px 0 18px}
      #settings .nero-tools button{min-height:40px}
      #settings .nero-tools .nero-file{display:none}
      #home .nero-recent{width:min(100%,760px);margin:28px auto 0}
      #home .nero-recent-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
      #home .nero-recent-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
      #home .nero-recent-item{display:flex;align-items:center;gap:10px;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;background:color-mix(in srgb,var(--panel) 88%,transparent);color:var(--text);text-align:left;cursor:pointer}
      #home .nero-recent-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      #home .nero-recent-empty{font-size:12px;color:var(--mute);padding:12px;border:1px dashed var(--line);border-radius:10px}
      #sites{position:relative;min-height:180px}
      .nero-page-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;min-height:190px;padding:25px;text-align:center;color:var(--mute)}
      .nero-page-state strong{color:var(--text);font-size:14px}
      .nero-page-state p{margin:0;font-size:12px;max-width:420px}
      .nero-page-state .nero-state-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
      .nero-spinner{width:24px;height:24px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:nero-spin .8s linear infinite}
      @keyframes nero-spin{to{transform:rotate(360deg)}}
      @media(max-width:600px){
        #settings .set .row{align-items:flex-start;flex-direction:column;gap:9px;padding:12px 10px}
        #settings .set .row>.ctl,#settings .set .row>.custom-color-row{width:100%;justify-content:flex-start;flex-wrap:wrap;flex:1}
        #settings .set .row input[type=range],#settings .set .row select{width:100%;max-width:100%}
        #settings #nero-customization .custom-colors{grid-template-columns:1fr}
      }`;
    document.head.appendChild(css);

    // Wrap the native settings controls into consistent visual cards.
    const nativeGroups=[...settings.children].filter(el=>el.classList.contains('grp'));
    nativeGroups.forEach(el=>{el.style.padding='14px';el.style.border='1px solid var(--line)';el.style.borderRadius='13px';el.style.background='color-mix(in srgb,var(--panel) 82%,transparent)'});
    const qol=document.createElement('section');qol.id='nero-qol-tools';
    qol.innerHTML='<h2>backup & restore</h2><p class="customization-note">Export your NERO preferences to a file, or restore them on another device.</p><div class="nero-tools"><button class="btn" id="nero-export-settings" type="button">Export settings</button><button class="ghost" id="nero-import-trigger" type="button">Import settings</button><input class="nero-file" id="nero-import-file" type="file" accept="application/json,.json"></div><p class="customization-note">This includes appearance, wallpaper, shortcuts, tab preferences and other NERO settings stored in this browser. It does not export website logins or cookies.</p>';
    settings.appendChild(qol);
    const importFile=document.getElementById('nero-import-file');
    document.getElementById('nero-export-settings').onclick=function(){
      const data={format:'nero-settings',version:1,exportedAt:new Date().toISOString(),settings:{}};
      for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&(k.startsWith('fl-')||k.startsWith('nero.')))data.settings[k]=localStorage.getItem(k)}
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download='nero-settings.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
      if(typeof toast==='function')toast('Settings exported');
    };
    document.getElementById('nero-import-trigger').onclick=()=>importFile.click();
    importFile.onchange=async function(){
      const file=this.files&&this.files[0];if(!file)return;
      try{
        if(file.size>2*1024*1024)throw new Error('Settings file is too large (2 MB maximum)');
        const data=JSON.parse(await file.text());
        if(data.format!=='nero-settings'||!data.settings||typeof data.settings!=='object'||Array.isArray(data.settings))throw new Error('That is not a valid NERO settings backup');
        const entries=Object.entries(data.settings).filter(([k,v])=>(k.startsWith('fl-')||k.startsWith('nero.'))&&typeof v==='string');
        if(!entries.length)throw new Error('No NERO settings were found in this file');
        if(!confirm('Import '+entries.length+' settings? This will replace matching settings in this browser.'))return;
        entries.forEach(([k,v])=>localStorage.setItem(k,v));
        alert('Settings imported. NERO will reload to apply them.');location.reload();
      }catch(e){alert(e.message||'Could not import this settings file')}
      finally{this.value=''}
    };

    // Recently visited is local to this browser profile.
    const home=document.querySelector('#home .hero');
    if(home&&!document.getElementById('nero-recent')){
      const recent=document.createElement('section');recent.className='nero-recent';recent.id='nero-recent';
      recent.innerHTML='<div class="nero-recent-head"><strong>Recently visited</strong><button class="ghost" id="nero-clear-recent" type="button">Clear</button></div><div class="nero-recent-list" id="nero-recent-list"></div>';
      home.appendChild(recent);
    }
    const RECENT_KEY='nero.recent.visited.v1';
    function readRecent(){try{const x=JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');return Array.isArray(x)?x.filter(v=>v&&typeof v.url==='string'&&typeof v.title==='string').slice(0,15):[]}catch(e){return[]}}
    function drawRecent(){
      const list=document.getElementById('nero-recent-list');if(!list)return;list.replaceChildren();const items=readRecent();
      if(!items.length){const empty=document.createElement('div');empty.className='nero-recent-empty';empty.textContent='Websites you visit will appear here.';list.appendChild(empty);return}
      items.slice(0,8).forEach(item=>{const b=document.createElement('button');b.type='button';b.className='nero-recent-item';const icon=document.createElement('span');icon.textContent='↗';const label=document.createElement('span');label.textContent=item.title;b.append(icon,label);b.title=item.url;b.onclick=()=>{const input=document.getElementById('url');if(input){input.value=item.url;input.dispatchEvent(new KeyboardEvent('keydown',{key:'Enter',bubbles:true}))}};list.appendChild(b)});
    }
    document.getElementById('nero-clear-recent').onclick=()=>{localStorage.removeItem(RECENT_KEY);drawRecent()};
    function recordRecent(){
      const input=document.getElementById('url'),value=input&&input.value;
      if(!value||!/^https?:\/\//i.test(value))return;
      try{
        const u=new URL(value);if(u.hostname==='nero-tube.onrender.com')return;
        const title=u.hostname.replace(/^www\./,'');
        let items=readRecent().filter(x=>x.url!==u.href);items.unshift({url:u.href,title,visitedAt:Date.now()});
        localStorage.setItem(RECENT_KEY,JSON.stringify(items.slice(0,15)));drawRecent();
      }catch(e){}
    }
    const tabBar=document.getElementById('tabs');
    if(tabBar)new MutationObserver(()=>{if(document.getElementById('url')?.value.startsWith('http'))recordRecent()}).observe(tabBar,{childList:true,subtree:true});
    drawRecent();

    // Clear loading and failure states for proxy startup without pretending to inspect remote page contents.
    const sites=document.getElementById('sites'),siteView=document.getElementById('site');
    function stateView(kind,title,message,action){
      if(!sites)return;let box=document.getElementById('nero-page-state');
      if(!box){box=document.createElement('div');box.id='nero-page-state';box.className='nero-page-state';sites.appendChild(box)}
      box.replaceChildren();
      if(kind==='loading'){const spin=document.createElement('div');spin.className='nero-spinner';box.appendChild(spin)}
      const strong=document.createElement('strong');strong.textContent=title;const p=document.createElement('p');p.textContent=message;box.append(strong,p);
      if(action){const actions=document.createElement('div');actions.className='nero-state-actions';const b=document.createElement('button');b.className='ghost';b.type='button';b.textContent=action.label;b.onclick=action.run;actions.appendChild(b);box.appendChild(actions)}
      box.hidden=false;
    }
    function clearState(){const box=document.getElementById('nero-page-state');if(box)box.hidden=true}
    const proxyButton=document.querySelector('.nero-proxy-status');
    if(proxyButton){
      const observer=new MutationObserver(()=>{
        const state=proxyButton.dataset.state;
        if(state==='pending')stateView('loading','Connecting to NERO proxy','Waking the proxy and preparing the secure browser session…');
        else if(state==='error')stateView('error','Proxy connection failed',proxyButton.title||'Check your Wisp server settings and try again.',{label:'Retry connection',run:()=>document.getElementById('wisp-start')?.click()});
        else if(state==='ready')clearState();
      });
      observer.observe(proxyButton,{attributes:true,attributeFilter:['data-state']});
    }
    if(siteView){
      const hint=document.createElement('p');hint.className='customization-note';hint.textContent='If a website stays blank, try Reload or check the proxy connection status above.';
      siteView.appendChild(hint);
    }
  });
  </script>

</head>
